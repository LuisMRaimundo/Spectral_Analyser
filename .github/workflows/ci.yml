name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every supported version even if one fails.
      fail-fast: false
      matrix:
        # Match the supported range declared in README / pyproject
        # (Python >=3.10,<3.12). 3.9 is intentionally NOT tested.
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system audio libraries
        # libsndfile backs soundfile/librosa I/O on the runner.
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: EWSD validation gate (Stage 3)
        run: pytest tests/phase_11/test_ewsd_golden_vectors.py tests/phase_11/test_ewsd_pure_matches_core.py tests/phase_11/test_ewsd_corpus_regression.py tests/phase_11/test_ewsd_uncertainty.py tests/phase_11/test_ewsd_stage3_contract.py tests/phase_11/test_research_export_includes_ewsd.py -q

      - name: ACD validation gate (Stage 3 companion)
        run: pytest tests/phase_32/test_acd_golden.py tests/phase_32/test_acd_axiomatic.py tests/phase_32/test_acd_structural.py tests/phase_32/test_acd_synthetic_recovery.py tests/phase_32/test_acd_invariance.py tests/phase_32/test_acd_erb_fraction_sensitivity.py tests/phase_32/test_acd_d1_tables.py tests/phase_32/test_acd_merge_strategy.py tests/phase_32/test_ewsd_part_b_repairs.py tests/phase_32/test_id_registry_uniqueness.py tests/phase_33/test_roughness_bandwidth_basis.py tests/phase_33/test_hk_subbass_bandwidth.py tests/phase_33/test_column_formula_versions.py tests/phase_33/test_corpus_manifest.py -q -m "not slow and not live_audio"

      - name: Run test suite
        # testpaths/markers are configured in pyproject.toml
        # ([tool.pytest.ini_options]); the slow end-to-end tests are skipped
        # by default and can be run on demand (see TESTING.md).
        run: pytest tests -q
